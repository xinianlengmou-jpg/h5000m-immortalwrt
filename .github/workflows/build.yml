name: Build H5000M

on:
  # 手动触发（GitHub 界面 Run workflow）
  workflow_dispatch:
    inputs:
      branch:
        description: '底层源码分支'
        default: 'master'
        required: true
        type: string
      packages:
        description: '临时追加插件（每行一条 CONFIG_PACKAGE_xxx=y，可留空）'
        required: false
        type: string
      test:
        description: '只导出 .config，不编译固件'
        default: false
        required: true
        type: boolean

  # 推送触发，方便用 git 直接开跑，不必进网页点按钮：
  #   git push -f origin main:test    -> 只导出 .config，几分钟，用来验配置
  #   git push -f origin main:build   -> 正式编译
  push:
    branches: [build, test]

  # 每周一 09:00（北京时间；GitHub cron 用 UTC，故写 01:00）自动做一次配置自检：
  # 只导出 .config + 跑关键配置自检，几分钟出结果，不编译固件、不发 Release。
  # 目的：上游（immortalwrt master / qmodem / mint / generic）一旦有变动导致
  #   依赖缺失、包被改名、libnftnl 版本漂移，能在想刷机之前就知道。
  # 结果看两处：Actions 该次运行的 step 级成败，以及 config-out 分支里的
  #   ci-out/diag.<run>.txt 与 h5000m.<run>.config。
  schedule:
    - cron: '0 1 * * 1'

# 注意：一旦显式写 permissions 块，未列出的 scope 全部归零。
# 少了 actions: write 的话 upload-artifact 会静默不产出（也不报错）。
permissions:
  contents: write
  actions: write

env:
  # 底层源码：官方主线
  SOURCE: https://github.com/immortalwrt/immortalwrt
  # 目标设备：只编这一台
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE: hiveton_h5000m
  # 是否只做「配置自检」（不编译固件、不发 Release）：
  #   - 推送到 test 分支
  #   - 或每周定时自检（on.schedule）
  # 正式编译（build 分支推送 / workflow_dispatch）时为 false。
  TEST_MODE: ${{ github.ref == 'refs/heads/test' || github.event_name == 'schedule' }}
  # 底层源码固定到这个 commit（2026-10-15 20:59，故障 merge 之前）。
  # 原因：上游 2026-10-16 03:22 的 "Merge Official Source"(95fa0528c4) 把
  #   package/libs/libnftnl 推到 1.3.2，但它自带的 fullcone 补丁
  #   (src/expr/fullcone.c，2024-11 按旧 API 写的) 没跟着改，
  #   nftnl_expr_fullcone_set 签名对不上 -> package/libs/libnftnl failed to build，
  #   整个 world 中断。等上游修好（libnftnl 与 fullcone 补丁重新对齐）后，
  #   把这一行清空即可恢复跟踪 master。
  # 留空 = 跟踪分支最新。
  # 2026-10-16 起恢复跟踪 master：依赖缺失 / 包改名 / libnftnl 版本漂移这类
  # 上游变动，改由每周自检（见 on.schedule）提前发现，而不是靠钉死版本躲过去。
  # 真被上游搞挂时，把 commit sha 填回这一行即可临时止血。
  # 同日已确认上游自行修复：ad9cadc「libnftnl: refresh patches after version bump」
  #   + 2248ed7「nftables: refresh patches after version bump」，
  #   即 1.3.2 + 刷新后的 fullcone 补丁 -> 不再炸。
  SOURCE_PIN: ''

jobs:
  build:
    name: H5000M (${{ inputs.branch || 'master' }})
    runs-on: ubuntu-latest
    # 平台硬上限 6h，留一点余量，否则会被直接杀掉、缓存来不及保存
    timeout-minutes: 345

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget ccache

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h / | tail -1

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: wrt/.ccache
          key: ccache-${{ env.DEVICE }}-${{ inputs.branch || 'master' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-${{ inputs.branch || 'master' }}-

      - name: 拉取底层源码
        run: |
          BR="${{ inputs.branch || 'master' }}"
          if [ -n "${{ env.SOURCE_PIN }}" ]; then
            # 固定版本：--depth=1 的 clone 拿不到历史 commit，
            # 直接 fetch 指定 commit 更省流量也更精确。
            mkdir -p wrt && cd wrt
            git init -q .
            git remote add origin "$SOURCE"
            git fetch --depth=1 origin "${{ env.SOURCE_PIN }}"
            git checkout -q FETCH_HEAD
            echo "已固定到 commit: ${{ env.SOURCE_PIN }}"
          else
            git clone --depth=1 --single-branch --branch "$BR" "$SOURCE" wrt
            cd wrt
          fi
          git log -1 --oneline
          echo "=== libnftnl 版本（须为 1.3.1，1.3.2 + 旧 fullcone 补丁会编译失败）==="
          grep -E '^PKG_VERSION' package/libs/libnftnl/Makefile

      - name: 更新官方 feeds
        run: cd wrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 挂载 QModem feeds
        run: bash "$GITHUB_WORKSPACE/scripts/feeds.sh" "$GITHUB_WORKSPACE/wrt"

      - name: 注入出厂默认文件
        # repo 的 files/ 目录按 rootfs 结构摆放，会被打进固件。
        # 两个落点都放，覆盖 buildroot 的两种定制文件机制：
        #   wrt/files/                        <- 官方文档的 custom files 目录
        #   wrt/package/base-files/files/     <- base-files 打 rootfs 时整目录拷进去（最稳）
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -d files ]; then
            mkdir -p wrt/files wrt/package/base-files/files
            cp -a files/. wrt/files/
            cp -a files/. wrt/package/base-files/files/
            find wrt/package/base-files/files/etc/uci-defaults -type f | sed 's/^/  注入: /'
          else
            echo "  files/ 不存在，跳过"
          fi

      - name: 生成 .config
        env:
          EXTRA_PACKAGES: ${{ inputs.packages }}
        run: |
          cd wrt
          {
            echo "CONFIG_TARGET_${TARGET}=y"
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=n"
            echo "CONFIG_TARGET_ALL_PROFILES=n"
            # 设备符号有两种形态，缺一不可：
            #   CONFIG_TARGET_<t>_<st>_DEVICE_<dev>   <- 真正决定编哪台机器
            #   CONFIG_TARGET_DEVICE_<t>_<st>_DEVICE_<dev> <- per-device rootfs 的 menuconfig
            # 只写后者的话 defconfig 会回落成默认 profile（实测落到了 openwrt_one）。
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE}=y"
            echo "CONFIG_TARGET_DEVICE_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE}=y"
            echo "CONFIG_TARGET_PROFILE=\"DEVICE_${DEVICE}\""
            cat "$GITHUB_WORKSPACE/config/base.seed"
            cat "$GITHUB_WORKSPACE/config/packages.txt"
            if [ -n "$EXTRA_PACKAGES" ]; then printf '%s\n' "$EXTRA_PACKAGES"; fi
            echo "CONFIG_CCACHE=y"
          } > .config
          make defconfig

      - name: 关键配置自检
        run: |
          cd wrt
          echo "===== defconfig 之后仍然生效的符号 ====="
          grep -E '^CONFIG_TARGET_DEVICE_|^CONFIG_TARGET_mediatek' .config || echo "!! 设备 profile 丢失"
          grep -E '^CONFIG_PACKAGE_(qmodem|quectel-CM-5G-M|input-support|luci-app-qmodem-generic|luci-theme-mint|luci-app-h5000m-fancontrol|kmod-hwmon-pwmfan)=' .config || echo "!! 模组相关包丢失"
          echo "===== 被 defconfig 丢掉的（写了却没生效）====="
          for s in CONFIG_PACKAGE_qmodem CONFIG_PACKAGE_luci-app-qmodem-generic CONFIG_PACKAGE_input-support CONFIG_PACKAGE_luci-theme-mint CONFIG_PACKAGE_luci-app-h5000m-fancontrol CONFIG_PACKAGE_kmod-hwmon-pwmfan; do
            grep -q "^${s}=y" .config || echo "  MISSING: $s"
          done

      - name: 导出 .config
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: wrt/.config

      - name: 生成诊断
        if: ${{ env.TEST_MODE == 'true' }}
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE/wrt"
          {
            echo "##### 0. 本次拉到的底层源码 #####"
            git log -1 --format='  commit  %H%n  日期    %ad%n  标题    %s' --date=iso 2>/dev/null \
              || echo "  (不是 git 仓库，SOURCE_PIN 走的是 tarball?)"
            echo "  --- libnftnl（1.3.2 且 fullcone 补丁没跟着刷新 = 必炸）---"
            if [ -f package/libs/libnftnl/Makefile ]; then
              grep -E '^PKG_(NAME|VERSION|RELEASE):=' package/libs/libnftnl/Makefile | sed 's/^/  /'
              ls -1 package/libs/libnftnl/patches/ 2>/dev/null | sed 's/^/  补丁 /'
            else
              echo "  ** 找不到 package/libs/libnftnl **"
            fi
            echo
            echo "##### 1. filogic.mk 设备定义 #####"
            awk '/define Device\/hiveton_h5000m/,/endef/' target/linux/mediatek/image/filogic.mk
            echo
            echo "##### 2. 目标 Kconfig 里该 profile 的条目 #####"
            if [ -f tmp/.config-target.in ]; then
              grep -n -B2 -A20 "hiveton_h5000m" tmp/.config-target.in | head -60
            else
              echo "(tmp/.config-target.in 不存在)"
            fi
            echo
            echo "##### 3. DEVICE_PACKAGES 各包在源码树里有没有 #####"
            for p in kmod-hwmon-pwmfan kmod-usb3 mt7987-2p5g-phy-firmware \
                     kmod-mt7996e kmod-mt7992-23-firmware f2fsck mkf2fs automount; do
              hit=$(find . -maxdepth 6 -type d -name "$p" 2>/dev/null | head -1)
              # kmod-* 没有独立目录，定义在 package/kernel/linux/modules/*.mk 的
              # KernelPackage/<名> 里；f2fsck/mkf2fs 是 f2fs-tools Makefile 里的子包。
              # 只看目录会把它们全误报成「缺失」，所以补一次 Makefile 检索。
              if [ -z "$hit" ]; then
                case "$p" in
                  # 两种写法都要认：define Package/xxx  和  Package/xxx = $(call ...)
                  # （linux-firmware 的 mediatek.mk 就是后一种）
                  kmod-*) pat="KernelPackage/${p#kmod-}([[:space:]]|$)" ;;
                  *)      pat="(PKG_NAME:=${p}[[:space:]]*$|Package/${p}([[:space:]]|=))" ;;
                esac
                # 注意：多数包的配方文件叫 Makefile，不是 *.mk，两个都要搜
                hit=$(grep -rlE --include='*.mk' --include='Makefile' "$pat" package target 2>/dev/null | head -1)
                [ -n "$hit" ] && hit="$hit (配方文件里定义)"
              fi
              echo "  $p -> ${hit:-** 缺失 **}"
            done
            echo
            echo "##### 4. profile 符号最终状态 #####"
            grep -E "hiveton|openwrt_one" .config
            echo
            echo "##### 5. 第三方 feeds 装进来了哪些包 #####"
            for f in qmodem qmodem_generic luci_theme_mint fancontrol; do
              echo "  [feed] $f"
              ls -1 "package/feeds/$f" 2>/dev/null | sed 's/^/    /' || echo "    ** 该 feed 没有任何包被 install **"
            done
            echo
            echo "##### 6. 注入的出厂默认文件 #####"
            ls -l "$GITHUB_WORKSPACE"/wrt/package/base-files/files/etc/uci-defaults/ 2>/dev/null \
              || echo "  ** 没找到 uci-defaults，files/ 没注入成功 **"
            echo
            echo "##### 7. filogic 下所有可选 profile #####"
            grep -oE "TARGET_DEVICE_mediatek_filogic_DEVICE_[a-zA-Z0-9_-]+" tmp/.config-target.in 2>/dev/null \
              | sort -u | head -40
          } > "$GITHUB_WORKSPACE/diag.txt" 2>&1 || true

      - name: 回传诊断与 .config 到 config-out 分支
        if: ${{ env.TEST_MODE == 'true' }}
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git checkout -B config-out origin/main || true
          mkdir -p ci-out
          cp wrt/.config "ci-out/h5000m.${{ github.run_number }}.config" || true
          cp diag.txt "ci-out/diag.${{ github.run_number }}.txt" || true
          git add -f ci-out || true
          git commit -m "ci: 输出 .config 与诊断 (run ${{ github.run_number }})" || echo "无变更可提交"
          git push -f origin config-out || echo "push 失败"

      - name: 下载源码包
        if: ${{ inputs.test != true && env.TEST_MODE != 'true' }}
        run: cd wrt && make download -j8

      - name: 编译固件
        if: ${{ inputs.test != true && env.TEST_MODE != 'true' }}
        # tee 出一份日志，失败时才有东西可查（Actions 日志匿名 API 读不到）
        run: |
          cd wrt
          make -j$(nproc) world 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: 回传失败日志
        if: ${{ failure() }}
        continue-on-error: true
        # 并行 make 的报错被吞在子进程里。先 -j1 V=s 重跑：已编完的部分秒过，
        # 会在几分钟内停在真正的失败点并打出完整报错。
        run: |
          cd "$GITHUB_WORKSPACE/wrt"
          {
            echo "##### 1. 失败点重跑 (-j1 V=s，末尾 300 行) #####"
            make -j1 V=s world 2>&1 | tail -300
            echo
            echo "##### 2. 报错行定位 #####"
            echo
            echo "##### 3. 磁盘 #####"
            df -h / | tail -1
          } > "$GITHUB_WORKSPACE/buildfail.txt" 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git checkout -B config-out origin/main || true
          mkdir -p ci-out
          cp buildfail.txt "ci-out/buildfail.${{ github.run_number }}.txt" || true
          git add -f ci-out || true
          git commit -m "ci: 编译失败日志 (run ${{ github.run_number }})" || echo "无变更可提交"
          git push -f origin config-out || echo "push 失败"

      - name: 收集产物
        if: ${{ inputs.test != true && env.TEST_MODE != 'true' }}
        run: |
          mkdir -p out
          # 镜像实际落在 bin/targets/<target>/<subtarget>/ 下（相对 wrt/bin/targets 是第 3 层），
          # maxdepth 2 只能看到 .../mediatek/filogic 这一层目录，一个文件都捞不到
          # -> 后面 upload-artifact 的 if-no-files-found: error 直接把整次编译判死。
          find wrt/bin/targets -maxdepth 3 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' \
               -o -name 'sha256sums' -o -name '*.buildinfo' \) -exec cp {} out/ \;
          ls -lh out
          [ -n "$(ls -A out)" ] || { echo "!! out/ 为空，打印 bin/targets 实际结构"; find wrt/bin/targets -maxdepth 4 | head -40; exit 1; }

      - name: 上传固件
        if: ${{ inputs.test != true && env.TEST_MODE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-h5000m
          path: out/*
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ inputs.test != true && env.TEST_MODE != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: H5000M-${{ inputs.branch || 'master' }}-${{ github.run_number }}
          name: H5000M ${{ inputs.branch || 'master' }} #${{ github.run_number }}
          files: out/*
          body: |
            底层源码：${{ env.SOURCE }}（分支 `${{ inputs.branch || 'master' }}`）
            设备：`${{ env.DEVICE }}`（mediatek/filogic）
            提交：${{ github.sha }}
